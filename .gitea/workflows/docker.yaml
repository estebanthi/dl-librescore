name: Build & push Docker image

on: [ push ]

env:
  REF: "refs/heads/webserver"

jobs:
  publish:
    runs-on: ubuntu-latest
    if: gitea.ref == ${{ env.REF }}
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4
      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3
      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: https://${{ secrets.DOCKER_REGISTRY_HOST}}
          username: ${{ secrets.DOCKER_REGISTRY_USER}}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
      - name: Build and push webserver Docker image
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          file: "Dockerfile"
          push: true
          tags: "${{ secrets.DOCKER_REGISTRY_HOST }}/dl-librescore_webserver:${{gitea.sha}},${{ secrets.DOCKER_REGISTRY_HOST }}/dl-librescore_webserver:latest"
      - name: Build and push frontend Docker image
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: ./frontend
          file: "./frontend/Dockerfile"
          push: true
          tags: "${{ secrets.DOCKER_REGISTRY_HOST }}/dl-librescore_frontend:${{gitea.sha}},${{ secrets.DOCKER_REGISTRY_HOST }}/dl-librescore_frontend:latest"
